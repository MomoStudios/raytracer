[package]
name = "raytracer"
version = "0.2.0"
edition = "2021"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wgpu = "25"
pollster = "0.4"
bytemuck = { version = "1.14", features = ["derive"] }

[profile.release]
opt-level = 3
